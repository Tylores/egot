# Nginx API Gateway Configuration
# This file configures the nginx reverse proxy for the microservices

# Server configuration
server:
  # Listen address (0.0.0.0 for all interfaces, 127.0.0.1 for localhost only)
  listen: "127.0.0.1"
  
  # Listen port
  port: 8443
  
  # Server name (used in nginx server_name directive)
  server_name: "localhost"

# SSL/TLS configuration
tls:
  # Path to server certificate (relative to repository root)
  cert: "./ssl/server.crt"
  
  # Path to server key (relative to repository root)
  key: "./ssl/server.key"
  
  # Path to CA certificate for client verification (optional)
  ca_cert: "./ssl/ca.crt"

# Logging configuration
logging:
  # Access log file path
  access_log: "./logs/nginx_access.log"
  
  # Error log file path
  error_log: "./logs/nginx_error.log"
  
  # Log level (debug, info, notice, warn, error, crit, alert, emerg)
  error_log_level: "warn"

# Proxy configuration
proxy:
  # Connection timeout (seconds)
  connect_timeout: 10
  
  # Read timeout (seconds)
  read_timeout: 30
  
  # Send timeout (seconds)
  send_timeout: 30
  
  # Buffer size for proxy responses
  buffer_size: "4k"

# Service mappings (auto-generated from routes.go)
# This section is maintained automatically and should not be edited manually
services: {}
